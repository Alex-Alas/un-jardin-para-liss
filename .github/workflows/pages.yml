# Publica el juego en GitHub Pages en cada push a main.
#
# El repo se sirve tal cual: no hay build ni bundler, el juego corre abriendo index.html.
# La primera vez hay que ir a Settings → Pages y poner «Source: GitHub Actions» (el paso
# configure-pages lo intenta solo con `enablement`, pero si el repo no lo permite, falla ahí).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si entran dos push seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que el juego esté completo
        run: node tools/validar_contenido.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          # El repo entero: index.html en la raíz, y assets/, src/ y vendor/ al lado.
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
