<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>UN JARDÍN PARA LISS</title>
  <meta name="description" content="Un jueguito corto para Liss, por el Día de las Flores Amarillas." />
  <meta name="theme-color" content="#0b0a10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0a10'/%3E%3Crect x='6' y='2' width='4' height='4' fill='%23ffd23f'/%3E%3Crect x='2' y='6' width='4' height='4' fill='%23ffd23f'/%3E%3Crect x='10' y='6' width='4' height='4' fill='%23ffd23f'/%3E%3Crect x='6' y='10' width='4' height='4' fill='%23ffd23f'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23e8a020'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="juego"></div>
  <div id="fotos" aria-hidden="true"></div>

  <div id="girar" hidden>
    <div class="girar-caja">
      <div class="girar-icono" aria-hidden="true"></div>
      <p class="girar-titulo">Gira el teléfono</p>
      <p class="girar-texto">Un jardín se ve mejor de lado</p>
      <button id="girar-seguir" type="button">jugar así</button>
    </div>
  </div>

  <noscript><p id="sin-js">Este jueguito necesita JavaScript activado.</p></noscript>

  <script src="vendor/phaser.min.js"></script>
  <script src="assets/manifest.js"></script>
  <script src="src/config.js"></script>
  <script src="src/assets.js"></script>

  <script src="src/systems/ui.js"></script>
  <script src="src/systems/fx.js"></script>
  <script src="src/systems/input.js"></script>
  <script src="src/systems/pantalla.js"></script>
  <script src="src/systems/save.js"></script>
  <script src="src/systems/dialog.js"></script>
  <script src="src/systems/fotos.js"></script>
  <script src="src/systems/memories.js"></script>
  <script src="src/audio/chiptune.js"></script>

  <script src="src/data/personajes.js"></script>
  <script src="src/data/dialogos.js"></script>
  <script src="src/data/mapas.js"></script>

  <script src="src/scenes/Boot.js"></script>
  <script src="src/scenes/Title.js"></script>
  <script src="src/scenes/Mundo.js"></script>
  <script src="src/scenes/Casa.js"></script>
  <script src="src/scenes/Pueblo.js"></script>
  <script src="src/scenes/Floreria.js"></script>
  <script src="src/scenes/Colina.js"></script>
  <script src="src/scenes/Petalos.js"></script>
  <script src="src/scenes/Album.js"></script>
  <script src="src/scenes/Creditos.js"></script>

  <script src="src/main.js"></script>

  <!-- La pantalla completa la pide src/systems/pantalla.js con un gesto del jugador. -->

  <script>
    // Invitación a girar el teléfono: aparece solo en vertical y se puede saltar.
    (function () {
      var capa = document.getElementById('girar');
      var boton = document.getElementById('girar-seguir');
      var saltado = false;

      function revisar() {
        var vertical = window.innerHeight > window.innerWidth;
        var chico = Math.min(window.innerWidth, window.innerHeight) < 620;
        capa.hidden = !(vertical && chico && !saltado);
      }

      boton.addEventListener('click', function () {
        saltado = true;
        capa.hidden = true;
      });

      window.addEventListener('resize', revisar);
      window.addEventListener('orientationchange', function () {
        setTimeout(revisar, 240);
      });
      revisar();
    })();
  </script>
</body>
</html>
